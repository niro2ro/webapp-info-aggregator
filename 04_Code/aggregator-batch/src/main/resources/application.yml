# バッチ共通設定（Phase 0）。収集/通知の2アプリが共有する。
# Web サーバは持たない（ワンショット実行）。機密は環境変数で注入（NFR-11）。
spring:
  main:
    web-application-type: none          # サーバを起動せず、Runner 実行後に終了する
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aggregator}
    username: ${DB_USER:aggregator}
    password: ${DB_PASSWORD:aggregator}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # スキーマ管理は Web 側 or 手動 migrate に任せ、バッチは検証のみ（二重実行を避ける）
  flyway:
    enabled: false

app:
  user-agent: "${APP_USER_AGENT:Aggregator/0.1 (contact: you@example.com)}"

  # 収集のHTTPマナー・信頼性（BD-BATCH-C-04）。既定で動作し、必要時に環境変数で調整。
  collect:
    connect-timeout-ms: ${COLLECT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${COLLECT_READ_TIMEOUT_MS:10000}
    max-attempts: ${COLLECT_MAX_ATTEMPTS:3}
    min-host-interval-ms: ${COLLECT_MIN_HOST_INTERVAL_MS:1000}

  # LLM（収集時の構造化のみ）。既定 enabled=false → NoOp 実装でキー無しでも起動（開発/CI）。
  # 本番は enabled=true にし ANTHROPIC_API_KEY を環境変数で注入（application.yml に実値を書かない）。
  llm:
    enabled: ${LLM_ENABLED:false}
    model: ${LLM_MODEL:claude-sonnet-5}
    monthly-budget-jpy: ${LLM_MONTHLY_BUDGET_JPY:500}
    # ANTHROPIC_API_KEY は SDK が環境変数から直接読む（ここには書かない）

  # LINE 通知。既定 enabled=false → NoOp 実装でトークン無しでも通知フローを通しで検証できる。
  # 本番は enabled=true にし LINE_CHANNEL_TOKEN を環境変数で注入。
  line:
    enabled: ${LINE_ENABLED:false}
    channel-token: ${LINE_CHANNEL_TOKEN:}
    monthly-free-limit: ${LINE_MONTHLY_FREE_LIMIT:200}
