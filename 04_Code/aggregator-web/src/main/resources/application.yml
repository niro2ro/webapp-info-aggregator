# Web アプリ設定（Phase 0）
# 機密は環境変数で注入し、ここには実値を書かない（NFR-11 / DD-CFG-02）。
# ローカル開発では docker-compose の既定値に合わせた default を付ける（${VAR:default}）。

spring:
  application:
    name: aggregator-web
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aggregator}
    username: ${DB_USER:aggregator}
    password: ${DB_PASSWORD:aggregator}   # ローカル開発用 default。本番は環境変数のみ
  jpa:
    hibernate:
      ddl-auto: validate                  # スキーマは Flyway に一本化（DD-DAO-12）
    open-in-view: false                   # 遅延ロードは表示層に持ち込まない（DD-DAO-11）
    properties:
      hibernate:
        jdbc:
          time_zone: UTC                  # 保存は UTC（NFR-08）
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  user-agent: "${APP_USER_AGENT:Aggregator/0.1 (contact: you@example.com)}"

  # 収集のHTTPマナー・信頼性（管理ダッシュボードの手動収集でも使用）。
  collect:
    connect-timeout-ms: ${COLLECT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${COLLECT_READ_TIMEOUT_MS:10000}
    max-attempts: ${COLLECT_MAX_ATTEMPTS:3}
    min-host-interval-ms: ${COLLECT_MIN_HOST_INTERVAL_MS:1000}
    max-body-chars: ${COLLECT_MAX_BODY_CHARS:4000}   # LLMに渡す本文の最大文字数(コスト抑制)
    search-max-items-per-theme: ${COLLECT_SEARCH_MAX_ITEMS:30}   # テーマ検索収集で1テーマあたり処理する上限(実行時間の抑制)
    # テーマ検索収集の検索RSS（{q}=キーワード）。既定はGoogleニュース。利用規約は各自で確認・差し替え可。
    search-feed-url-template: ${COLLECT_SEARCH_FEED_URL:https://news.google.com/rss/search?q={q}&hl=ja&gl=JP&ceid=JP:ja}

  # LLM/LINE は既定で無効（NoOp）。Web は収集/通知を実行しないが、共有 Bean のため設定を持つ。
  # 実値（APIキー/トークン）は環境変数で注入し、ここには書かない（NFR-11・BD-IF-00-01）。
  llm:
    enabled: ${LLM_ENABLED:false}
    model: ${LLM_MODEL:claude-haiku-4-5}
    monthly-budget-jpy: ${LLM_MONTHLY_BUDGET_JPY:500}
  line:
    enabled: ${LINE_ENABLED:false}
    channel-token: ${LINE_CHANNEL_TOKEN:}
    channel-secret: ${LINE_CHANNEL_SECRET:}   # Webhook署名検証用（合言葉連携）。実値は環境変数で注入
    monthly-free-limit: ${LINE_MONTHLY_FREE_LIMIT:200}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: INFO
